name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        # 沒有 .secrets/ 時整合測試會自動略過，只跑單元測試
        run: xcodebuild -project Finify.xcodeproj -scheme Finify -destination 'platform=macOS' test
