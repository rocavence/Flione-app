name: Flione
options:
  bundleIdPrefix: app.finify
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  AudioStreaming:
    url: https://github.com/dimitris-c/AudioStreaming
    exactVersion: 1.4.5
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.8.1"
    CURRENT_PROJECT_VERSION: "1"
schemes:
  Flione:
    build:
      targets:
        Flione: all
        FlioneTests: [test]
    test:
      targets:
        - FlioneTests
targets:
  Flione:
    type: application
    platform: macOS
    sources:
      - Flione
    # 簽章設定在 Config/Signing.xcconfig；本機憑證放 Signing.local.xcconfig（不進版控，D21）
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.finify.Finify
        GENERATE_INFOPLIST_FILE: YES
        # bundle id 仍是 app.finify.Finify：換掉會讓設定、音樂庫快取與鑰匙圈資料全部遺失（D25）
        INFOPLIST_KEY_CFBundleDisplayName: Flione
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 介面翻譯用 String Catalog（Resources/Localizable.xcstrings）；建置時抽出 Swift 裡的可翻譯字串
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_HARDENED_RUNTIME: YES
    # finify:// 網址（URLCommands.swift）；其餘 Info.plist 內容由 GENERATE_INFOPLIST_FILE 產生
    info:
      path: Flione/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: app.finify.Finify
            CFBundleURLSchemes: [flione, finify]
  FlioneTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FlioneTests
    dependencies:
      - target: Flione
    # 測試 bundle 要和 app 同一個簽章身分，否則 hardened runtime 不讓它載入
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # 技術驗證用，不隨 app 出貨
  AlbumWallSpike:
    type: application
    platform: macOS
    sources:
      - path: Spikes/AlbumWall
        excludes:
          - make-artwork.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.finify.spike.AlbumWall
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
  # 技術驗證用，不隨 app 出貨
  GaplessSpike:
    type: application
    platform: macOS
    sources:
      - path: Spikes/Gapless
    dependencies:
      - package: AudioStreaming
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.finify.spike.Gapless
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "5.0"
