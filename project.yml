name: Finify
options:
  bundleIdPrefix: app.finify
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Finify:
    type: application
    platform: macOS
    sources:
      - Finify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.finify.Finify
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Finify
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
