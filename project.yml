name: Finify
options:
  bundleIdPrefix: app.finify
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  AudioStreaming:
    url: https://github.com/dimitris-c/AudioStreaming
    exactVersion: 1.4.5
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
schemes:
  Finify:
    build:
      targets:
        Finify: all
        FinifyTests: [test]
    test:
      targets:
        - FinifyTests
targets:
  Finify:
    type: application
    platform: macOS
    sources:
      - Finify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.finify.Finify
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Finify
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
  FinifyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FinifyTests
    dependencies:
      - target: Finify
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
  # 技術驗證用，不隨 app 出貨
  AlbumWallSpike:
    type: application
    platform: macOS
    sources:
      - path: Spikes/AlbumWall
        excludes:
          - make-artwork.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.finify.spike.AlbumWall
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
  # 技術驗證用，不隨 app 出貨
  GaplessSpike:
    type: application
    platform: macOS
    sources:
      - path: Spikes/Gapless
    dependencies:
      - package: AudioStreaming
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.finify.spike.Gapless
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "5.0"
