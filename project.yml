name: Finify
options:
  bundleIdPrefix: app.finify
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  AudioStreaming:
    url: https://github.com/dimitris-c/AudioStreaming
    exactVersion: 1.4.5
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
schemes:
  Finify:
    build:
      targets:
        Finify: all
        FinifyTests: [test]
    test:
      targets:
        - FinifyTests
targets:
  Finify:
    type: application
    platform: macOS
    sources:
      - Finify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.finify.Finify
        GENERATE_INFOPLIST_FILE: YES
        # 對外名稱是 Flione；程式內部與 bundle id 仍是 Finify（換 bundle id 會讓設定與鑰匙圈資料全部遺失，見 D25）
        PRODUCT_NAME: Flione
        PRODUCT_MODULE_NAME: Finify
        INFOPLIST_KEY_CFBundleDisplayName: Flione
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 用固定的開發者憑證簽章：ad-hoc（"-"）每次建置簽章都不同，鑰匙圈會一直要求輸入密碼（D21）
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development: you@example.com (XXXXXXXXXX)"
        DEVELOPMENT_TEAM: XXXXXXXXXX
        ENABLE_HARDENED_RUNTIME: YES
    # finify:// 網址（URLCommands.swift）；其餘 Info.plist 內容由 GENERATE_INFOPLIST_FILE 產生
    info:
      path: Finify/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: app.finify.Finify
            CFBundleURLSchemes: [flione, finify]
  FinifyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FinifyTests
    dependencies:
      - target: Finify
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # 產品名稱是 Flione（target 仍叫 Finify），test host 要指到 Flione.app
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Flione.app/Contents/MacOS/Flione
        BUNDLE_LOADER: $(TEST_HOST)
        # 測試 bundle 要和 app 同一個 Team，否則 hardened runtime 不讓它載入
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development: you@example.com (XXXXXXXXXX)"
        DEVELOPMENT_TEAM: XXXXXXXXXX
  # 技術驗證用，不隨 app 出貨
  AlbumWallSpike:
    type: application
    platform: macOS
    sources:
      - path: Spikes/AlbumWall
        excludes:
          - make-artwork.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.finify.spike.AlbumWall
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
  # 技術驗證用，不隨 app 出貨
  GaplessSpike:
    type: application
    platform: macOS
    sources:
      - path: Spikes/Gapless
    dependencies:
      - package: AudioStreaming
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.finify.spike.Gapless
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "5.0"
