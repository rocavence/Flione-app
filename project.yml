name: Flione
options:
  bundleIdPrefix: app.finify
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  AudioStreaming:
    url: https://github.com/dimitris-c/AudioStreaming
    exactVersion: 1.4.5
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
schemes:
  Flione:
    build:
      targets:
        Flione: all
        FlioneTests: [test]
    test:
      targets:
        - FlioneTests
targets:
  Flione:
    type: application
    platform: macOS
    sources:
      - Flione
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.finify.Finify
        GENERATE_INFOPLIST_FILE: YES
        # bundle id 仍是 app.finify.Finify：換掉會讓設定、音樂庫快取與鑰匙圈資料全部遺失（D25）
        INFOPLIST_KEY_CFBundleDisplayName: Flione
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 介面翻譯用 String Catalog（Resources/Localizable.xcstrings）；建置時抽出 Swift 裡的可翻譯字串
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # 用固定的開發者憑證簽章：ad-hoc（"-"）每次建置簽章都不同，鑰匙圈會一直要求輸入密碼（D21）
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development: you@example.com (XXXXXXXXXX)"
        DEVELOPMENT_TEAM: XXXXXXXXXX
        ENABLE_HARDENED_RUNTIME: YES
    # finify:// 網址（URLCommands.swift）；其餘 Info.plist 內容由 GENERATE_INFOPLIST_FILE 產生
    info:
      path: Flione/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: app.finify.Finify
            CFBundleURLSchemes: [flione, finify]
  FlioneTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FlioneTests
    dependencies:
      - target: Flione
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # 測試 bundle 要和 app 同一個 Team，否則 hardened runtime 不讓它載入
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development: you@example.com (XXXXXXXXXX)"
        DEVELOPMENT_TEAM: XXXXXXXXXX
  # 技術驗證用，不隨 app 出貨
  AlbumWallSpike:
    type: application
    platform: macOS
    sources:
      - path: Spikes/AlbumWall
        excludes:
          - make-artwork.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.finify.spike.AlbumWall
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
  # 技術驗證用，不隨 app 出貨
  GaplessSpike:
    type: application
    platform: macOS
    sources:
      - path: Spikes/Gapless
    dependencies:
      - package: AudioStreaming
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.finify.spike.Gapless
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "5.0"
